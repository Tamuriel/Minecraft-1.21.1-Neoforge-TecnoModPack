[global_warming]
	#Enable the global warming system. When on, blocks in the #solarpunk:pollution_sources tag
	#(campfires, furnaces, blaze burners, steam engines, etc.) emit black smog while active
	#and slowly convert the biome of their chunk to a dead wasteland.
	enabled = false
	#Default pollution units per second for any active source not listed in per_block_pollution.
	# Default: 5
	# Range: 0 ~ 1000000
	pollution_per_active_source_per_second = 5
	#Per-block pollution overrides in "block_id=amount" format.
	#Any block in #solarpunk:pollution_sources not listed here uses the default above.
	per_block_pollution = ["minecraft:campfire=2", "minecraft:soul_campfire=3", "minecraft:furnace=5", "minecraft:blast_furnace=8", "minecraft:smoker=4", "create:lit_blaze_burner=15", "create:steam_engine=20", "createdieselgenerators:diesel_engine=15", "createdieselgenerators:large_diesel_engine=30", "createdieselgenerators:huge_diesel_engine=50", "solarpunk:biofuel_engine=10", "solarpunk:biomass_gasifier=5", "solarpunk:firebox_boiler=6"]
	#Pollution units per second for each Create Aeronautics portable engine (all 16 dye colours).
	#Set to 0 to disable. Has no effect if Create Aeronautics is not installed.
	# Default: 15
	# Range: 0 ~ 1000000
	aeronautics_portable_engine_pollution_per_second = 15
	#Substrings matched against block registry paths for automatic pollution detection.
	#Any block whose registry path contains one of these keywords, and is not already in
	##solarpunk:pollution_sources, will emit the fallback pollution amount below.
	#Blocks with no block entity are ignored even if their name matches.
	auto_detect_keywords = ["furnace", "engine", "motor", "boiler", "burner", "kiln", "forge", "oven", "incinerator", "smokestack", "generator"]
	#Pollution units per second emitted by auto-detected blocks (keyword match, no explicit tag entry).
	# Default: 3
	# Range: 0 ~ 1000000
	auto_detect_pollution_per_second = 3
	#Block IDs that never count as pollution sources, even if in #solarpunk:pollution_sources
	#or matched by an auto-detect keyword (format: "modid:path").
	pollution_blacklist = ["create_new_age:generator_coil"]
	#Block radius around each active pollution source that receives pollution (0 = source chunk only).
	# Default: 64
	# Range: 0 ~ 512
	pollution_radius_blocks = 64
	#Pollution units removed from each chunk per second (0 = pollution never decays).
	# Default: 1
	# Range: 0 ~ 1000000
	pollution_decay_rate_per_second = 1
	#Pollution absorbed per leaf block in a chunk each decay interval. 0 to disable tree absorption.
	# Default: 1
	# Range: 0 ~ 1000000
	leaf_absorption_per_interval = 1
	#Pollution units removed per second by each placed Biofilter block.
	# Default: 10
	# Range: 0 ~ 1000000
	biofilter_absorption_per_second = 10
	#Block radius around a Biofilter in which it reduces pollution (0 = own chunk only).
	# Default: 32
	# Range: 0 ~ 512
	biofilter_radius_blocks = 32
	#Pollution level a chunk must reach before its biome converts.
	# Default: 10000
	# Range: > 1
	biome_decay_threshold = 10000
	#Ticks between each decay and biome-conversion check (1200 = once per minute).
	# Default: 1200
	# Range: 20 ~ 72000
	biome_decay_interval_ticks = 1200
	#Random surface blocks replaced per polluted chunk each decay interval (grass dies, leaves fall, flowers wither). 0 to disable.
	# Default: 8
	# Range: 0 ~ 256
	blocks_decayed_per_interval = 8
	#The biome polluted chunks convert to once they reach the threshold (resource location format).
	dead_biome = "minecraft:badlands"
